name: Publish npm packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or commit to publish
        required: true
        type: string
      tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 45
    env:
      NPM_DIST_TAG: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'next' || 'latest') || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Install build dependencies
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm ci --prefix common --no-fund --no-audit
          npm ci --prefix daemon --no-fund --no-audit
          npm ci --prefix panel --no-fund --no-audit
          npm ci --prefix frontend --no-fund --no-audit
      - name: Check source
        run: |
          npm test
          npm run type-check
      - name: Include native tools
        run: wget --input-file=lib-urls.txt --directory-prefix=daemon/lib/ --tries=3 --timeout=60
      - name: Build npm packages
        run: npm run build:npm
      - name: Create npm archives
        run: |
          npm pack ./npm-packages/daemon --ignore-scripts --pack-destination npm-packages
          npm pack ./npm-packages/panel --ignore-scripts --pack-destination npm-packages
          npm pack ./npm-packages/create-elementspanel --ignore-scripts --pack-destination npm-packages
      - name: Upload npm archives
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-packages/*.tgz
          if-no-files-found: error
      - name: Publish runtime packages, then initializer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish npm-packages/elementspanel-daemon-*.tgz --access public --provenance --ignore-scripts --tag "$NPM_DIST_TAG"
          npm publish npm-packages/elementspanel-panel-*.tgz --access public --provenance --ignore-scripts --tag "$NPM_DIST_TAG"
          npm publish npm-packages/create-elementspanel-*.tgz --access public --provenance --ignore-scripts --tag "$NPM_DIST_TAG"
